# Blessing Hub: dedicated virtual host, independent of the existing API proxy.
# Cloudflare Full mode: reuse the existing origin certificate.
# For Full (strict), provision a certificate covering blessingshs.cc.cd first.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name blessingshs.cc.cd www.blessingshs.cc.cd;

    ssl_certificate /etc/nginx/cert.crt;
    ssl_certificate_key /etc/nginx/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/blessing-hub/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml application/rss+xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location /downloads/ {
        try_files $uri =404;
        default_type text/markdown;
        expires -1;
    }

    location = /feed.xml {
        types { application/rss+xml xml; }
        expires -1;
    }

    location = /sitemap.xml {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
